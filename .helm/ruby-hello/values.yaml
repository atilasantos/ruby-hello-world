# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 2

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: atilarmao/ruby-hello
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.1"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: "ruby-hello"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 3000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "nginx-ruby-hello"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: "/"

  hosts:
    - host: local.localhost
      paths:
        - path: "/"
          pathType: Prefix
        - path: "/*"
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /up
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}


nginxproxy:
  enabled: true

  replicaCount: 1

  fullnameOverride: nginx-ruby-hello

  ingressClassResource:
    name: nginx-ruby-hello

  image:
    registry: docker.io
    repository: bitnami/nginx-ingress-controller
    tag: 1.11.3-debian-12-r0

  config: {}
    
  containerPorts:
    http: 80

  service:
    ## @param service.annotations; annotations for the nginx ingress controller
    ## AWS
    ## service.beta.kubernetes.io/aws-load-balancer-scheme: internal ('internet-facing' for public LB)
    ## service.beta.kubernetes.io/aws-load-balancer-internal: "true" (remove for public LB)
    ## service.beta.kubernetes.io/aws-load-balancer-type: nlb
    ## service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    ## Azure
    ## service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    ## service.beta.kubernetes.io/azure-load-balancer-ipv4: 10.240.0.25 (Optional)
    ## GKE
    ## networking.gke.io/load-balancer-type: "Internal"
    ## networking.gke.io/load-balancer-ip-addresses: "10.240.0.25" (Optional)
    ## kubernetes.io/ingress.global-static-ip-name: my-static-address (must be created upfront)
    annotations: {}

  nodeSelector: {}

  ## @param affinity; Affinity for pod assignment. Evaluated as a template.
  ##    podAntiAffinity:
  ##    requiredDuringSchedulingIgnoredDuringExecution:
  ##      - labelSelector:
  ##          matchLabels:
  ##            app.kubernetes.io/name: nginxproxy
  ##        topologyKey: kubernetes.io/hostname
  ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  tolerations: []

  ## @param topologySpreadConstraints; pods assignment spread across your cluster among failure-domains
  ## - maxSkew: 1
  ##   topologyKey: topology.kubernetes.io/zone
  ##   whenUnsatisfiable: DoNotSchedule
  ##   labelSelector:
  ##     matchLabels:
  ##       app.kubernetes.io/name: nginxproxy
  ##       app.kubernetes.io/component: controller
  topologySpreadConstraints: []

  scope:
    enabled: false
    namespace: ""

  networkPolicy:
    enabled: false

  resources:
    requests:
      memory: 512Mi

  defaultBackend:
    image:
      registry: docker.io
      repository: bitnami/nginx
      tag: 1.27.2-debian-12-r0

    networkPolicy:
      enabled: false

    resources:
      requests:
        memory: 256Mi

    nodeSelector: {}

    ## @param affinity; Affinity for pod assignment. Evaluated as a template.
    ##    podAntiAffinity:
    ##    requiredDuringSchedulingIgnoredDuringExecution:
    ##      - labelSelector:
    ##          matchLabels:
    ##            app.kubernetes.io/name: defaultBackend
    ##        topologyKey: kubernetes.io/hostname
    ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
    affinity: {}

    tolerations: []

    ## @param topologySpreadConstraints; pods assignment spread across your cluster among failure-domains
    ## - maxSkew: 1
    ##   topologyKey: topology.kubernetes.io/zone
    ##   whenUnsatisfiable: DoNotSchedule
    ##   labelSelector:
    ##     matchLabels:
    ##       app.kubernetes.io/name: defaultBackend
    topologySpreadConstraints: []
